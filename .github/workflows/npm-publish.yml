# Publish dsh-mcp to the public npm registry when a GitHub Release is created.

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Zero-dependency package: run focused regression tests and syntax smoke checks.
      - run: npm test
      - run: node --check lib/index.js
      - run: node --check lib/client.js
      - run: node --check scripts/build.mjs

  publish-npm:
    needs: check
    runs-on: ubuntu-latest
    # Job-level env so actions/setup-node writes the auth token into .npmrc
    # and `npm publish` picks it up from the same environment.
    env:
      NODE_AUTH_TOKEN: ${{secrets.npm_token}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm publish
